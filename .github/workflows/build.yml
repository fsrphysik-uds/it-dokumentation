# Kompiliert das Dokument bei jedem Push und Pull Request.
# Wurde auf main eine neue Versionsnummer (\version in main.tex) gepusht,
# wird automatisch ein Tag v<Version> und ein GitHub-Release mit der PDF erstellt.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # fsrbase.sty und das Fachschaftslogo liegen im Repository latex-templates
      - name: latex-templates auschecken
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/latex-templates
          path: latex-templates

      - name: Version auslesen
        id: version
        run: |
          version=$(sed -n 's/.*\\newcommand{\\version}{\(.*\)}.*/\1/p' main.tex)
          if [ -z "$version" ]; then
            echo "::error::Keine Versionsnummer in main.tex gefunden"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Release nur für Pushes auf main, deren Version noch keinen Tag hat
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nix installieren
        uses: cachix/install-nix-action@v31

      # "//" lässt TeX auch Unterverzeichnisse (media/) durchsuchen,
      # der abschließende ":" hängt die Standardpfade an
      - name: Dokument kompilieren
        env:
          TEXINPUTS: "${{ github.workspace }}/latex-templates//:"
        run: nix develop --command latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: PDF umbenennen
        run: mv main.pdf IT-Dokumentation-v${{ steps.version.outputs.version }}.pdf

      - name: PDF als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: IT-Dokumentation
          path: IT-Dokumentation-*.pdf

      - name: Tag und Release erstellen
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: IT-Dokumentation-*.pdf
